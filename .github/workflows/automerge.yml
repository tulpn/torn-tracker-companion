# Copy to .github/workflows/automerge.yml in every repo of the suite that works through
# pull requests: the site (PRs into `development`) and the companion (PRs into `main`).
# RULES.md section 3.
#
# It merges a PR as soon as every check on its head commit has passed, so no Claude seat
# ever has to run `gh pr merge`. A PR is merged only when:
#   - it comes from a branch in this repo (never a fork) and was opened by tulpn;
#   - it is not a draft and has no `hold` label;
#   - its base is in the repo variable AUTOMERGE_BASES (space-separated, e.g. `development`);
#   - every check run and commit status on its head commit is green (or skipped).
#
# Setup, once per repo (the owner):
#   1. This file must be on the repo's DEFAULT branch: GitHub always runs the default
#      branch's copy of a workflow_run workflow.
#   2. Secret AUTOMERGE_TOKEN: a fine-grained token of tulpn, this repo only, with
#      Contents and Pull requests set to read and write. A merge made with it runs CI on
#      the target branch (GITHUB_TOKEN merges would not).
#   3. Variable AUTOMERGE_BASES: `development` for the site, `main` for the companion.
#
# The merge commit is authored as tulpn's noreply address and committed by GitHub, which
# author-check allows. Add every workflow that runs on pull requests to `workflows:`; the
# last one to finish triggers the merge. Names that do not exist in a repo are ignored.
name: automerge

on:
  workflow_run:
    workflows: [CI, test, author-check]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: automerge-${{ github.event.workflow_run.head_sha }}
    env:
      GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BASES: ${{ vars.AUTOMERGE_BASES }}
      OWNER_LOGIN: tulpn
      NOREPLY: 1031452+tulpn@users.noreply.github.com
    steps:
      - name: Merge the PR when everything is green
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ] || [ -z "$BASES" ]; then
            echo "AUTOMERGE_TOKEN or AUTOMERGE_BASES is not set; nothing to do."; exit 0
          fi

          pr=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" \
            --jq "[.[] | select(.state == \"open\" and .head.sha == \"$SHA\")][0] // empty")
          if [ -z "$pr" ]; then echo "No open PR has $SHA as its head."; exit 0; fi

          num=$(jq -r .number <<<"$pr")
          base=$(jq -r .base.ref <<<"$pr")
          author=$(jq -r .user.login <<<"$pr")
          head_repo=$(jq -r .head.repo.full_name <<<"$pr")
          draft=$(jq -r .draft <<<"$pr")
          hold=$(jq -r '[.labels[].name] | index("hold") != null' <<<"$pr")
          echo "PR #$num: $author, into $base, draft=$draft, hold=$hold"

          [ "$head_repo" = "$GH_REPO" ] || { echo "From a fork; not merging."; exit 0; }
          [ "$author" = "$OWNER_LOGIN" ] || { echo "Not opened by $OWNER_LOGIN; not merging."; exit 0; }
          [ "$draft" = "false" ] || { echo "Draft; not merging."; exit 0; }
          [ "$hold" = "false" ] || { echo "Labelled hold; not merging."; exit 0; }
          case " $BASES " in *" $base "*) ;; *) echo "Base $base is not in AUTOMERGE_BASES."; exit 0 ;; esac

          # Every check run on the head commit must be finished and green. A run still in
          # progress means another workflow_run event comes later and retries.
          pending=$(gh api --paginate "repos/$GH_REPO/commits/$SHA/check-runs" \
            --jq '.check_runs[] | select(.status != "completed") | .name')
          failed=$(gh api --paginate "repos/$GH_REPO/commits/$SHA/check-runs" \
            --jq '.check_runs[] | select(.status == "completed" and (.conclusion | IN("success", "skipped", "neutral") | not)) | "\(.name): \(.conclusion)"')
          status=$(gh api "repos/$GH_REPO/commits/$SHA/status" --jq '.state')
          if [ -n "$pending" ]; then echo "Still running:"; echo "$pending"; exit 0; fi
          if [ -n "$failed" ]; then echo "Not green:"; echo "$failed"; exit 0; fi
          if [ "$status" != "success" ] && [ "$(gh api "repos/$GH_REPO/commits/$SHA/status" --jq '.total_count')" != "0" ]; then
            echo "Commit status is $status."; exit 0
          fi

          gh pr merge "$num" --merge --match-head-commit "$SHA" --author-email "$NOREPLY"
          echo "Merged PR #$num into $base."
