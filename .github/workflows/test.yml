name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Deterministic install from the committed lock file; plain install only before the first lock exists.
      - run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm test
      # Torn's scripting rules, scanned on the source (specs/companion.md section 6).
      - run: npm run lint:rules
